version: '3.8'
services:
  backend:
    image: node:18
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && node server.js"
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://db:27017/practiceDB
    depends_on:
      - db

  db:
    image: mongo:latest
    ports:
      - "27017:27017"

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "80:80"
